casehub.connectors.twilio.account-sid=test-sid
casehub.connectors.twilio.auth-token=test-token
casehub.connectors.twilio.from=+10000000000
casehub.connectors.whatsapp.api-token=test-token
casehub.connectors.whatsapp.phone-number-id=test-phone
casehub.connectors.slack.bot-token=test-token
casehub.connectors.discord.bot-token=test-token
casehub.connectors.teams.tenant-id=test-tenant
casehub.connectors.teams.client-id=test-client
casehub.connectors.teams.client-secret=test-secret

# Index neocortex RAG module so @ConfigMapping beans are discovered
quarkus.index-dependency.neocortex-rag.group-id=io.casehub
quarkus.index-dependency.neocortex-rag.artifact-id=casehub-neocortex-rag-core

# Neocortex RAG config — test defaults (in-memory stores displace Qdrant at runtime)
casehub.rag.qdrant.host=localhost
casehub.rag.qdrant.port=6334
casehub.rag.qdrant.use-tls=false
casehub.rag.tenancy-strategy=COLLECTION_PER_TENANT
casehub.rag.dense-vector-name=dense
casehub.rag.sparse-vector-name=sparse
casehub.rag.bm25-enabled=false
casehub.rag.bm25-vector-name=bm25
casehub.rag.colbert-vector-name=colbert
casehub.rag.embedding-batch-size=32
casehub.rag.max-multivector-floats=65536
casehub.rag.retrieval.fusion-strategy=RRF
casehub.rag.retrieval.dense-top-k=10
casehub.rag.retrieval.sparse-top-k=10
casehub.rag.retrieval.bm25-top-k=10
casehub.rag.retrieval.rrf-k=60
casehub.rag.retrieval.rerank-enabled=false
casehub.rag.retrieval.rerank-top-n=5
casehub.rag.retrieval.weights.dense=0.7
casehub.rag.retrieval.weights.sparse=0.3
casehub.rag.retrieval.quality-max=1.0
casehub.rag.matryoshka.enabled=false
casehub.rag.matryoshka.dimensions=384
casehub.rag.quantization.enabled=false
casehub.rag.quantization.type=SCALAR
casehub.rag.colbert-quantization.enabled=false
casehub.rag.colbert-quantization.type=SCALAR
casehub.rag.ingestion.interval=PT1H
casehub.rag.ingestion.cursor-dir=/tmp/rag-cursors
casehub.rag.dedup.enabled=false
casehub.rag.dedup.threshold=0.95
